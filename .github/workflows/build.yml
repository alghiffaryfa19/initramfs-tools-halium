name: Build initramfs

on:
  push:
    branches: ["**"]
    tags:
      - "droidian/**/*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Lint – quick shell-syntax check (mirrors override_dh_auto_test)
  # ------------------------------------------------------------------
  lint:
    name: Shell syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          set -e
          for f in hooks/* scripts/panic/telnet scripts/halium; do
            echo "Checking sh syntax of $f"
            sh -n "$f"
          done

  # ------------------------------------------------------------------
  # Build – cross-build initrd images for each architecture
  # ------------------------------------------------------------------
  build:
    name: Build initrd (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        arch: [armhf, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build inside Debian Trixie container
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}:/work -w /work debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            echo "deb [trusted=yes] https://staging.repo.droidian.org/ trixie main" > /etc/apt/sources.list.d/droidian-staging.list
            
            apt-get update
            apt-get install -y debootstrap qemu-user-static binfmt-support dpkg-dev lz4 \
              initramfs-tools busybox-static coreutils e2fsprogs lvm2 dropbear \
              cryptsetup-initramfs plymouth plymouth-themes pigz tar xkb-data \
              libc6-dev libssl-dev dmsetup gcc
              
            apt-get install -y plymouth-theme-droidian lxc-android unl0kr \
              droidian-encryption-service parse-android-dynparts
              
            # Add gcc to INCHROOTPKGS so dpkg-architecture works inside the chroot
            export INCHROOTPKGS="initramfs-tools dctrl-tools e2fsprogs libc6-dev zlib1g-dev libssl-dev busybox-static lvm2 cryptsetup xkb-data dropbear pigz liblz4-tool gcc"
            
            ./build-initrd.sh -a ${{ matrix.arch }} -c gzip -n initrd.img-halium-generic
            ./build-initrd.sh -a ${{ matrix.arch }} -c gzip -n recovery-initramfs.img-halium-generic -r
            ./build-initrd.sh -a ${{ matrix.arch }} -c lz4 -n initrd.img-halium-generic-lz4
            ./build-initrd.sh -a ${{ matrix.arch }} -c lz4 -n recovery-initramfs.img-halium-generic-lz4 -r
          '

      - name: Fix artifact permissions
        run: sudo chown -R $USER:$USER out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: initrd-${{ matrix.arch }}
          path: out/
          retention-days: 30

  # ------------------------------------------------------------------
  # Release – upload assets when a Droidian release tag is pushed
  # ------------------------------------------------------------------
  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
